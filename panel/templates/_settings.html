<section id="schedule" class="view" data-page="schedule" hidden>
  <form id="settings-form" class="settings-form">
    <fieldset class="form-fields"><legend class="sr-only">自动签到与通知设置</legend>
      <div class="settings-section-label">{{ icon('timer') }}<h2>执行计划</h2></div>
      <div class="form-row"><div class="form-description"><label for="enabled">自动签到</label><p id="enabled-help">每天按计划运行，也可随时手动执行。</p></div><div class="switch-field"><label class="switch"><input id="enabled" type="checkbox" role="switch" aria-label="自动签到" aria-describedby="enabled-help"><span></span></label><span id="enabled-label">已开启</span></div></div>
      <div class="form-row"><div class="form-description"><h3>时间安排</h3><p>随机延迟会加在每日执行时间之后。</p></div><div class="schedule-fields"><div class="field"><label for="run-at">每日执行时间</label><input id="run-at" type="time" required></div><div class="field"><label for="jitter">随机延迟（分钟）</label><input id="jitter" type="number" min="0" max="240" step="0.1" required></div><div class="field timezone-field"><label for="timezone">时区</label><input id="timezone" list="timezones" placeholder="Asia/Shanghai" required autocomplete="off" spellcheck="false"><datalist id="timezones"><option value="Asia/Shanghai"><option value="Asia/Hong_Kong"><option value="Asia/Tokyo"><option value="UTC"><option value="America/New_York"><option value="Europe/London"></datalist></div></div></div>
      <div class="form-row"><div class="form-description"><label for="random">随机奖励</label><p id="random-help">开启时领取随机收益，关闭时领取固定收益。</p></div><div class="switch-field"><label class="switch"><input id="random" type="checkbox" role="switch" aria-label="随机奖励" aria-describedby="random-help"><span></span></label><span id="random-label">随机收益</span></div></div>
      <div class="settings-section-label">{{ icon('bell') }}<h2>结果通知</h2><span id="bark-status" class="badge">未配置</span></div>
      <div class="form-row"><div class="form-description"><label for="bark">Bark 推送</label><p>把签到结果发送到你的设备。</p></div><div class="field"><label class="field-label" for="bark">推送地址</label><p id="bark-help" class="field-hint">留空保存会保留原值。删除地址请勾选下方选项。</p><input id="bark" type="url" autocomplete="off" spellcheck="false" placeholder="https://api.day.app/你的设备密钥" aria-describedby="bark-help"><label class="checkbox-label clear-bark"><input type="checkbox" id="clear-bark">保存时清除推送地址</label></div></div>
      <div class="form-row"><div class="form-description"><label for="bark-only-on-failure">仅失败时通知</label><p id="bark-policy-help">签到成功或今日已签到时，不发送推送。</p></div><label class="switch"><input id="bark-only-on-failure" type="checkbox" role="switch" aria-label="仅失败时通知" aria-describedby="bark-policy-help"><span></span></label></div>
    </fieldset>
    <div class="save-bar"><span id="settings-save-state" class="save-state">{{ icon('check') }}所有更改已保存</span><div><button id="settings-reset" type="button" class="button secondary" disabled>撤销更改</button><button type="submit" class="button primary" disabled>{{ icon('save') }}<span data-button-label>保存设置</span></button></div></div>
  </form>
  <section class="appearance-section"><div class="settings-section-label">{{ icon('sun-moon') }}<h2>工作台外观</h2></div><div class="form-row"><div class="form-description"><label for="theme-select">显示主题</label><p>仅保存在当前浏览器，立即生效。</p></div><div class="field theme-field"><select id="theme-select"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></div></div></section>
</section>
